# Injected process environment wins over config.conf and .env
INJECT_OVERWRITE=true

# Host bind address for direct run and published ports
HOST=127.0.0.1

# CITADEL FastAPI web UI internal port
CITADEL_WEBUI_PORT=10999

# CITADEL FastAPI web UI host port
CITADEL_WEBUI_PUBLISH_PORT=10999

# Host subnet IP used by CITADEL scans
CITADEL_SUBNET_IP=

# Tailscale hostname
TS_HOSTNAME=

# CITADEL container capabilities
CITADEL_CAPABILITIES=NET_ADMIN,NET_RAW

# CITADEL container devices
CITADEL_DEVICES=/dev/net/tun

# CITADEL container volumes
CITADEL_VOLUMES=tailscale:/var/lib/tailscale
