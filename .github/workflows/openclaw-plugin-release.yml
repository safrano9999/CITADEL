# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: OpenClaw plugin

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "20*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  ZIP_NAME: citadel-latest.zip

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/20') && format('actual-head-{0}', github.repository) || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start actual-head history
        if: startsWith(github.ref, 'refs/tags/20')
        run: bash .github/scripts/actual-head.sh start

      - name: Purge old Actions artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/purge-github-actions-artifacts.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check sources
        run: |
          node --check index.js
          bash -n scan.sh
          python -m unittest discover -s tests

      - name: Build plugin archive
        run: bash .github/scripts/openclaw_plugin_zip.sh

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
          else
            gh release create "$tag" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --title "$tag" \
              --notes "OpenClaw plugin archive for CITADEL."
          fi

      - name: Publish latest alias
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_tag="latest"
          notes="Latest OpenClaw plugin archive for CITADEL. Current source tag: ${GITHUB_REF_NAME}."
          if gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release upload "$latest_tag" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber
            gh release edit "$latest_tag" --title "$latest_tag" --notes "$notes"
          else
            gh release create "$latest_tag" "$ZIP_NAME" "$ZIP_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "$latest_tag" \
              --notes "$notes"
          fi

      - name: Purge Actions artifacts after run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/purge-github-actions-artifacts.sh

      - name: Finish actual-head history
        if: startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/actual-head.sh finish

      - name: Publish build log
        id: actual_head_upload
        if: startsWith(github.ref, 'refs/tags/20')
        uses: actions/upload-artifact@v4
        with:
          name: actual-head
          path: actual-head.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Prune previous build logs
        if: startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/actual-head.sh cleanup "${{ steps.actual_head_upload.outputs.artifact-id }}"
