# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Citadel Alpine image
run-name: "Citadel Alpine image [monitor:${{ inputs.monitor_id }}:true]"

on:
  push:
    tags: ["20*.*.*"]
  workflow_dispatch:
    inputs:
      monitor_id:
        description: Event monitor correlation id
        type: string
        default: ""
      monitor_final:
        type: boolean
        default: true
      image_tag:
        description: "YYYY.MM.N; empty selects the next monthly number"
        type: string
        default: ""
      replace_existing:
        description: "Explicitly replace the requested version during an authorized rebuild"
        type: boolean
        default: false

concurrency:
  group: citadel-container-image
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve immutable monthly version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        run: echo "tag=$(python .github/scripts/resolve-image-tag.py)" >> "$GITHUB_OUTPUT"
  build-test-push:
    needs: prepare
    if: github.repository_owner == 'safrano9999'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
            caddy_sha: b8bec15d14fb033562af9f207850027bcbaa1f891edc9efe00d38bf39e1bf9944f8b6b8eba041ddd4c171cd70c905174c704d705be2f23bc678fe1eaf37a2485
          - architecture: arm64
            runner: ubuntu-24.04-arm
            caddy_sha: 5466234be3e988071cef937aedbdd94c15b6f75cf7307397e67c2641219ac9bfe2c2bb3b31fc05bc68d3b6398bbe50abfa16ccf3b127318ccac31115ad26507c
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      IMAGE: ghcr.io/safrano9999/citadel
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test sources
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests
          node --test workers/cloudflare-api/worker.test.mjs

      - name: Verify generated HTTPS routes with Caddy
        run: |
          curl --fail --location --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_${{ matrix.architecture }}.tar.gz -o "$RUNNER_TEMP/caddy.tar.gz"
          echo "${{ matrix.caddy_sha }}  $RUNNER_TEMP/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          CADDY_TEST_BIN="$RUNNER_TEMP/caddy" python -m unittest discover -s tests -p test_caddy_https.py -v

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build on GitHub Actions
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/scripts/Containerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}

      - name: Smoke-test TCP, Unix socket and optional state
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
        run: bash .github/scripts/smoke-image.sh

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish tested image
        run: |
          set -euo pipefail
          for ref in "$IMAGE:$IMAGE_TAG"; do
            for attempt in 1 2 3; do
              if docker push "$ref"; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep "$((attempt * 3))"
            done
          done

      - name: Verify public package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api users/safrano9999/packages/container/citadel --jq .visibility)"
          if [ "$visibility" != public ]; then
            echo "::warning::GHCR defaults to private. Set citadel Package settings > Change visibility > Public once."
            echo 'Image pushed, but PUBLIC RELEASE PENDING: https://github.com/users/safrano9999/packages/container/citadel/settings' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  publish-manifest:
    needs: [prepare, build-test-push]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/safrano9999/citadel
      IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tested multi-architecture manifest
        run: |
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" --tag "$IMAGE:latest" \
            "$IMAGE:$IMAGE_TAG-amd64" "$IMAGE:$IMAGE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --raw \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | unique | sort == ["amd64", "arm64"]'
