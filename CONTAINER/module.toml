schema_version = 1

[module]
name = "citadel"
kind = "repo"
source = "https://github.com/safrano9999/CITADEL.git"
target_dir = "citadel"
description = "CITADEL FastAPI service dashboard"
default_selected = true
dependencies = ["python3"]

[[ports]]
env_key = "CITADEL_WEBUI_PORT"
default = 10999
publish = true
description = "CITADEL FastAPI WebUI"
